name: olxv2

x-php: &php
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    image: olxv2-php:local
    working_dir: /var/www/html
    volumes:
        - .:/var/www/html
        - vendor:/var/www/html/vendor

services:
    postgres:
        image: postgres:17-bookworm
        environment:
            POSTGRES_DB: ${DB_DATABASE:-olxv2}
            POSTGRES_USER: ${DB_USERNAME:-olxv2}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Run local environment setup first}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init-testing.sql:/docker-entrypoint-initdb.d/10-testing.sql:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:7.4-alpine
        command:
            [
                'redis-server',
                '--appendonly',
                'yes',
                '--maxmemory-policy',
                'noeviction',
            ]
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        command: server /data --console-address ':9001'
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Run local environment setup first}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Run local environment setup first}
        volumes:
            - minio_data:/data
        ports:
            - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
            - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
        healthcheck:
            test:
                ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    storage-init:
        image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
        entrypoint: ['/bin/sh', '/init.sh']
        environment:
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_BUCKET: ${AWS_BUCKET:-olxv2-local}
        volumes:
            - ./docker/minio-init.sh:/init.sh:ro
        depends_on:
            minio: { condition: service_healthy }

    mailpit:
        image: axllent/mailpit:v1.27
        environment:
            MP_DATABASE: /data/mailpit.db
            MP_MAX_MESSAGES: 500
        volumes:
            - mailpit_data:/data
        ports:
            - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
        healthcheck:
            test: ['CMD', '/mailpit', 'readyz']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    setup:
        <<: *php
        command: ['sh', 'docker/setup.sh']
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
            storage-init: { condition: service_completed_successfully }

    app:
        <<: *php
        depends_on:
            setup: { condition: service_completed_successfully }
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'php-fpm -t 2>&1 && php artisan app:ready --quiet',
                ]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 20s
        restart: unless-stopped

    queue:
        <<: *php
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=2',
                '--tries=3',
                '--timeout=90',
                '--max-time=3600',
            ]
        stop_grace_period: 100s
        depends_on:
            app: { condition: service_healthy }
            mailpit: { condition: service_healthy }
        restart: unless-stopped

    scheduler:
        <<: *php
        command: ['php', 'artisan', 'schedule:work']
        depends_on:
            app: { condition: service_healthy }
        restart: unless-stopped

    assets:
        image: node:24-alpine
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        command: ['sh', '-c', 'npm ci --no-audit --no-fund && npm run build']

    vite:
        image: node:24-alpine
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        command: ['npm', 'run', 'dev']
        profiles: ['dev']
        ports:
            - '127.0.0.1:5173:5173'
        depends_on:
            assets: { condition: service_completed_successfully }

    browser:
        image: mcr.microsoft.com/playwright:v1.63.0-noble
        working_dir: /var/www/html
        profiles: ['test']
        environment:
            PLAYWRIGHT_BASE_URL: http://web
            CI: 'true'
        volumes:
            - .:/var/www/html
            - browser_node_modules:/var/www/html/node_modules
        command:
            ['sh', '-c', 'npm ci --no-audit --no-fund && npm run test:browser']
        shm_size: 1gb

    web:
        image: nginx:1.28-alpine
        ports:
            - '127.0.0.1:${APP_PORT:-8088}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app: { condition: service_healthy }
            assets: { condition: service_completed_successfully }
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '-q',
                    '--spider',
                    'http://127.0.0.1/health/ready',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:
    minio_data:
    mailpit_data:
    vendor:
    node_modules:

    browser_node_modules:
